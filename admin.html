<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex, nofollow">
  <title>Studio | Site Editor</title>
  <meta name="theme-color" content="#0b0b0c">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&family=IBM+Plex+Sans:wght@400;500;600;700&family=Instrument+Serif&family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Lora:wght@400;500;600;700&family=Merriweather:wght@400;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- optional passphrase gate -->
  <div class="lock" id="lock" style="display:none">
    <div class="lock__box">
      <h1>Site Editor</h1>
      <p>Enter your passphrase to continue.</p>
      <input class="in" id="lock-input" type="password" placeholder="Passphrase" autocomplete="current-password">
      <button id="lock-go">Unlock</button>
      <div class="lock__err" id="lock-err"></div>
    </div>
  </div>

  <div id="app" style="display:none">
    <div class="top">
      <span class="top__brand">
        <img class="top__monogram" src="assets/mz-mark.svg" alt="" aria-hidden="true">
        <span>Portfolio Studio</span>
      </span>
      <span class="top__status" id="status">Draft loaded</span>
      <span class="top__spacer"></span>
      <div class="top__actions">
        <button id="btn-save">Save draft</button>
        <button id="btn-github">Publish to GitHub</button>
        <button id="btn-preview-toggle">Hide preview</button>
        <button id="btn-open">Open site ↗</button>
        <button class="primary" id="btn-export">Export ZIP</button>
      </div>
    </div>

    <div class="shell">
      <nav class="side" id="side"></nav>
      <main class="main" id="main"></main>
      <section class="preview" id="preview">
        <div class="preview__bar">
          <span class="preview__label">Live preview</span>
          <select class="in" id="preview-page">
            <option value="index.html">Home</option>
            <option value="projects.html">All Projects</option>
          </select>
          <button class="mini" id="preview-refresh" title="Refresh">↻</button>
        </div>
        <iframe id="preview-frame" title="Live preview"></iframe>
      </section>
    </div>
  </div>

  <!-- defaults come from the committed data file -->
  <script src="data.js"></script>
  <script>
  (function(){
    "use strict";
    var DRAFT_KEY = "mzPortfolioDraft";
    var THEME_CACHE_KEY = "mzPortfolioDraftTheme";
    var DRAFT_DB_NAME = "mzPortfolioStudio";
    var DRAFT_STORE = "drafts";
    var PASS_KEY  = "mzAdminPassHash";

    function openDraftDb(){
      return new Promise(function(resolve, reject){
        if (!window.indexedDB) { reject(new Error("IndexedDB is not available.")); return; }
        var request = indexedDB.open(DRAFT_DB_NAME, 1);
        request.onupgradeneeded = function(){
          var db = request.result;
          if (!db.objectStoreNames.contains(DRAFT_STORE)) db.createObjectStore(DRAFT_STORE);
        };
        request.onsuccess = function(){ resolve(request.result); };
        request.onerror = function(){ reject(request.error || new Error("Could not open draft storage.")); };
      });
    }
    function readDraftFromDb(){
      return openDraftDb().then(function(db){
        return new Promise(function(resolve, reject){
          var tx = db.transaction(DRAFT_STORE, "readonly");
          var request = tx.objectStore(DRAFT_STORE).get(DRAFT_KEY);
          request.onsuccess = function(){ resolve(request.result || null); };
          request.onerror = function(){ reject(request.error || new Error("Could not read the saved draft.")); };
          tx.oncomplete = function(){ db.close(); };
        });
      });
    }
    function writeDraftToDb(value){
      return openDraftDb().then(function(db){
        return new Promise(function(resolve, reject){
          var tx = db.transaction(DRAFT_STORE, "readwrite");
          tx.objectStore(DRAFT_STORE).put(value, DRAFT_KEY);
          tx.oncomplete = function(){ db.close(); resolve(); };
          tx.onerror = function(){ db.close(); reject(tx.error || new Error("Could not save the draft.")); };
          tx.onabort = function(){ db.close(); reject(tx.error || new Error("Draft save was interrupted.")); };
        });
      });
    }
    function removeDraftFromDb(){
      return openDraftDb().then(function(db){
        return new Promise(function(resolve, reject){
          var tx = db.transaction(DRAFT_STORE, "readwrite");
          tx.objectStore(DRAFT_STORE).delete(DRAFT_KEY);
          tx.oncomplete = function(){ db.close(); resolve(); };
          tx.onerror = function(){ db.close(); reject(tx.error || new Error("Could not remove the draft.")); };
        });
      });
    }
    function hasEmbeddedMedia(value){
      if (typeof value === "string") return value.indexOf("data:image/") === 0;
      if (!value || typeof value !== "object") return false;
      if (Array.isArray(value)) return value.some(hasEmbeddedMedia);
      return Object.keys(value).some(function(key){ return hasEmbeddedMedia(value[key]); });
    }
    function persistDraft(value){
      var localSaved = false;
      try {
        if (hasEmbeddedMedia(value)) {
          localStorage.removeItem(DRAFT_KEY);
        } else {
          localStorage.setItem(DRAFT_KEY, JSON.stringify(value));
          localSaved = true;
        }
      } catch(e) {
        try { localStorage.removeItem(DRAFT_KEY); } catch(_){}
      }
      return writeDraftToDb(value).catch(function(err){
        if (localSaved) return;
        throw err;
      });
    }

    /* ---------- tiny DOM helper ---------- */
    function h(tag, opts, kids){
      var e = document.createElement(tag);
      opts = opts || {};
      if (typeof opts === "string") { e.className = opts; }
      else {
        for (var k in opts){
          if (k === "class") e.className = opts[k];
          else if (k === "text") e.textContent = opts[k];
          else if (k === "html") e.innerHTML = opts[k];
          else if (k === "attrs") for (var a in opts.attrs) e.setAttribute(a, opts.attrs[a]);
          else if (k === "on") for (var ev in opts.on) e.addEventListener(ev, opts.on[ev]);
          else { try { e[k] = opts[k]; } catch(_){ e.setAttribute(k, opts[k]); } }
        }
      }
      if (kids != null){
        (Array.isArray(kids)?kids:[kids]).forEach(function(c){
          if (c == null || c === false) return;
          e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
        });
      }
      return e;
    }
    function clone(o){ return JSON.parse(JSON.stringify(o)); }
    function slug(s){ return String(s||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "project"; }
    function parseYouTube(v){ if(!v) return ""; var s=String(v).trim(); var m=s.match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([\w-]{6,})/); return m ? m[1] : s; }
    function cacheDraftTheme(theme){
      try { localStorage.setItem(THEME_CACHE_KEY, JSON.stringify(theme || {})); } catch(_){}
    }

    /* ---------- state ---------- */
    var DEFAULTS = {
      PROFILE: (typeof PROFILE !== "undefined") ? clone(PROFILE) : {},
      THEME:   (typeof THEME   !== "undefined") ? clone(THEME)   : {},
      PROJECTS:(typeof PROJECTS !== "undefined") ? clone(PROJECTS): []
    };
    var state;
    function initializeState(draft){
      state = draft && draft.PROFILE ? draft : clone(DEFAULTS);
      // make sure containers exist
      state.PROFILE = state.PROFILE || {};
      state.THEME = Object.assign(clone(DEFAULTS.THEME), state.THEME || {});
      state.PROJECTS = state.PROJECTS || [];
      if ((state.PROFILE.layoutVersion || 0) < DEFAULTS.PROFILE.layoutVersion) {
        ["tagline", "intro", "about", "pillars", "stack"].forEach(function(key){
          state.PROFILE[key] = clone(DEFAULTS.PROFILE[key]);
        });
        state.PROFILE.layoutVersion = DEFAULTS.PROFILE.layoutVersion;
      }
      if ((state.PROFILE.expertiseVersion || 0) < (DEFAULTS.PROFILE.expertiseVersion || 0)) {
        var expertiseReplacements = {
          "Combat, AI & Character Systems": DEFAULTS.PROFILE.pillars[1],
          "Technical Leadership & Developer Tools": DEFAULTS.PROFILE.pillars[3]
        };
        state.PROFILE.pillars = (state.PROFILE.pillars || []).map(function(pillar){
          return expertiseReplacements[pillar.title] ? clone(expertiseReplacements[pillar.title]) : pillar;
        });
        state.PROFILE.expertiseVersion = DEFAULTS.PROFILE.expertiseVersion;
      }
      if ((state.PROFILE.projectDataVersion || 0) < DEFAULTS.PROFILE.projectDataVersion) {
        state.PROJECTS = clone(DEFAULTS.PROJECTS);
        state.PROFILE.projectDataVersion = DEFAULTS.PROFILE.projectDataVersion;
      }
      if ((state.PROFILE.copyVersion || 0) < (DEFAULTS.PROFILE.copyVersion || 0)) {
        state.PROFILE.intro = DEFAULTS.PROFILE.intro;
        state.PROFILE.about = DEFAULTS.PROFILE.about;
        state.PROFILE.footerTagline = DEFAULTS.PROFILE.footerTagline;
        state.PROFILE.copyVersion = DEFAULTS.PROFILE.copyVersion;
      }
      if ((state.PROFILE.typeVersion || 0) < (DEFAULTS.PROFILE.typeVersion || 0)) {
        state.PROFILE.typeVersion = DEFAULTS.PROFILE.typeVersion;
      }
      if ((state.PROFILE.themeFoundationVersion || 0) < (DEFAULTS.PROFILE.themeFoundationVersion || 0)) {
        ["bg", "bg2", "surface", "surface2", "line", "lineSoft"].forEach(function(key){
          state.THEME[key] = DEFAULTS.THEME[key];
        });
        state.PROFILE.themeFoundationVersion = DEFAULTS.PROFILE.themeFoundationVersion;
      }
      delete state.THEME.fontMono;
      // Refresh known default palettes while preserving custom themes and font choices.
      if (
        (state.THEME.bg === "#0b0c0d" && state.THEME.accent === "#E8A33D") ||
        (state.THEME.bg === "#0f100e" && state.THEME.accent === "#ff643f")
      ) {
        [
          "bg", "bg2", "surface", "surface2", "line", "lineSoft",
          "text", "muted", "faint", "accent", "accentSoft", "accentDeep",
          "heroText", "headingText", "projectTitle", "bodyText"
        ].forEach(function(key){ state.THEME[key] = DEFAULTS.THEME[key]; });
      }
      if (draft && draft.PROFILE) cacheDraftTheme(state.THEME);
      else {
        try { localStorage.removeItem(THEME_CACHE_KEY); } catch(_){}
      }
    }
    var localDraft = null;
    try { localDraft = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null"); } catch(e){}
    initializeState(localDraft);

    var statusEl, mainEl, previewFrame, previewPage, previewBox, savedTimer, prevTimer, persistTimer;
    var GH_KEY = "mzGitHubSettings";
    function loadGitHubSettings(){ try { return JSON.parse(localStorage.getItem(GH_KEY) || "null"); } catch(e){ return null; } }
    function saveGitHubSettings(s){ localStorage.setItem(GH_KEY, JSON.stringify(s)); }
    function utf8ToBase64(str){
      var bytes = new TextEncoder().encode(str);
      var bin = "";
      var chunkSize = 32768;
      for (var i = 0; i < bytes.length; i += chunkSize) {
        bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
      }
      return btoa(bin);
    }
    function setStatus(txt, ok){ if(!statusEl) return; statusEl.textContent = txt; statusEl.className = "top__status" + (ok?" saved":""); }
    function flushDraft(){
      clearTimeout(persistTimer);
      persistTimer = null;
      return persistDraft(state).then(function(){
        setStatus("saved", true);
        clearTimeout(savedTimer);
        savedTimer = setTimeout(function(){ setStatus("draft active"); }, 1600);
        clearTimeout(prevTimer);
        prevTimer = setTimeout(refreshPreview, 120);
      }).catch(function(err){
        console.error(err);
        setStatus("draft save failed", false);
      });
    }
    function save(){
      setStatus("saving");
      cacheDraftTheme(state.THEME);
      clearTimeout(persistTimer);
      persistTimer = setTimeout(flushDraft, 320);
    }
    function reRender(){ save(); render(); }

    function refreshPreview(){
      if (!previewFrame || previewBox.classList.contains("hidden")) return;
      var base = previewPage.value;
      previewFrame.src = base + (base.indexOf("?")>-1?"&":"?") + "_=" + Date.now();
    }

    function saveToGitHub(){
      var gh = loadGitHubSettings() || {};
      if (!gh.token || !gh.owner || !gh.repo) {
        alert("Configure GitHub token, owner, and repo in Settings first.");
        current = "settings"; editing = null; render(); return;
      }
      var branch = gh.branch || "main";
      var dataPath = gh.path || "data.js";
      var ex = collectExport();
      var b64Data = utf8ToBase64(ex.text);
      var message = "Update portfolio from admin panel";
      var savedKey = "mzSavedMediaPaths";
      var prevPaths = [];
      try { prevPaths = JSON.parse(localStorage.getItem(savedKey) || "[]"); } catch(_){}
      var currentPaths = ex.media.map(function(m){ return m.path; });
      var stale = prevPaths.filter(function(p){ return currentPaths.indexOf(p) === -1; });
      var apiBase = "https://api.github.com/repos/" + encodeURIComponent(gh.owner) + "/" + encodeURIComponent(gh.repo) + "/contents/";
      var getHeaders = {
        "Authorization": "token " + gh.token,
        "Accept": "application/vnd.github.v3+json"
      };
      var putHeaders = {
        "Authorization": "token " + gh.token,
        "Accept": "application/vnd.github.v3+json",
        "Content-Type": "application/json"
      };

      function putFile(relPath, b64content, isDelete){
        var apiUrl = apiBase + relPath;
        return fetch(apiUrl + "?ref=" + encodeURIComponent(branch), { headers: getHeaders })
          .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, status:r.status, data:d}; }); })
          .then(function(res){
            if (!res.ok && res.status !== 404) throw new Error(res.data.message || "GitHub error " + res.status);
            if (isDelete && res.status === 404) return;
            var body = { message: message, branch: branch };
            if (isDelete) body.sha = res.data.sha;
            else {
              body.content = b64content;
              if (res.status !== 404) body.sha = res.data.sha;
            }
            return fetch(apiUrl, { method: isDelete ? "DELETE" : "PUT", headers: putHeaders, body: JSON.stringify(body) })
              .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, status:r.status, data:d}; }); });
          })
          .then(function(res){
            if (res && !res.ok) throw new Error(res.data.message || "GitHub error " + res.status);
          });
      }

      setStatus("uploading " + ex.media.length + " image file(s)...");
      var chain = Promise.resolve();
      ex.media.forEach(function(m){
        chain = chain.then(function(){ return putFile(m.path, b64FromDataUrl(m.b64), false); });
      });
      stale.forEach(function(p){
        chain = chain.then(function(){ return putFile(p, "", true).catch(function(){}); });
      });
      chain = chain.then(function(){ return putFile(dataPath, b64Data, false); });
      chain.then(function(){
        try { localStorage.setItem(savedKey, JSON.stringify(currentPaths)); } catch(_){}
        setStatus("saved to GitHub ✓", true);
        clearTimeout(savedTimer); savedTimer = setTimeout(function(){ setStatus("draft active"); }, 3000);
        alert("Committed data.js and " + ex.media.length + " image file(s) to GitHub. It may take 1 to 2 minutes for GitHub Pages to update.");
      }).catch(function(err){
        setStatus("GitHub save failed", false);
        console.error(err);
        alert("Failed to save to GitHub: " + err.message);
      });
    }

    /* ---------- field builders ---------- */
    function field(label, value, onChange, o){
      o = o || {};
      var props = {
        class: "in" + (o.mono ? " in--mono" : ""),
        value: value == null ? "" : value,
        placeholder: o.placeholder || "",
        on: {}
      };
      props.on[o.event || "input"] = function(e){ onChange(e.target.value); };
      if (o.textarea) props.rows = o.rows || 4;     // textareas: rows, never .type (read-only)
      else props.type = o.type || "text";
      var input = h(o.textarea ? "textarea" : "input", props);
      return h("label", {class:"f"}, [
        h("span", {class:"f__label", text:label}),
        input,
        o.hint ? h("span",{class:"f__hint",text:o.hint}) : null
      ]);
    }
    function selectField(label, value, options, onChange){
      var sel = h("select", {class:"in", on:{ change:function(e){ onChange(e.target.value); } }},
        options.map(function(o){ return h("option",{value:o.value, selected:o.value===value, text:o.label}); }));
      return h("label",{class:"f"},[ h("span",{class:"f__label",text:label}), sel ]);
    }
    function checkField(label, checked, onChange){
      return h("label",{class:"check"},[
        h("input",{type:"checkbox", checked:!!checked, on:{ change:function(e){ onChange(e.target.checked); } }}),
        h("span",{text:label})
      ]);
    }
    function uploadField(label, cb){
      var status = h("span",{class:"upload-control__status",text:"PNG, JPG, WebP, GIF, or SVG"});
      var input = h("input",{type:"file", class:"upload-control__input", attrs:{accept:"image/*"}, on:{ change:function(e){
        var f = e.target.files && e.target.files[0];
        if (!f) return;
        if (!f.type || f.type.indexOf("image/") !== 0) {
          status.textContent = "Choose a valid image file.";
          status.classList.add("is-error");
          e.target.value = "";
          return;
        }
        if (f.size > 12 * 1024 * 1024 && !confirm("This image is larger than 12 MB and will make data.js much heavier. Upload it anyway?")) {
          e.target.value = "";
          return;
        }
        status.classList.remove("is-error");
        status.textContent = "Reading " + f.name + "...";
        var r = new FileReader();
        r.onerror = function(){
          status.textContent = "The image could not be read. Try the file again.";
          status.classList.add("is-error");
          e.target.value = "";
        };
        r.onload = function(){
          try {
            cb(r.result, f);
            status.textContent = f.name + " uploaded";
          } catch(err) {
            console.error(err);
            status.textContent = "The image could not be added.";
            status.classList.add("is-error");
          }
          e.target.value = "";
        };
        r.readAsDataURL(f);
      }}});
      var button = h("button",{
        class:"upload-control__button",
        text:"Choose image",
        attrs:{type:"button"},
        on:{click:function(){ input.click(); }}
      });
      return h("div",{class:"f"},[
        h("span",{class:"f__label",text:label}),
        h("div",{class:"upload-control"},[button,status,input])
      ]);
    }
    function rowTools(arr, i, after){
      function mk(t, disabled, fn){ return h("button",{class:"mini", text:t, attrs: disabled?{disabled:""}:{}, on:{ click:fn }}); }
      return h("div",{class:"tools"},[
        mk("↑", i===0, function(){ var t=arr[i-1]; arr[i-1]=arr[i]; arr[i]=t; after(); }),
        mk("↓", i===arr.length-1, function(){ var t=arr[i+1]; arr[i+1]=arr[i]; arr[i]=t; after(); }),
        mk("✕", false, function(){ if(confirm("Remove this item?")){ arr.splice(i,1); after(); } })
      ]);
    }
    function addBtn(label, fn){ return h("button",{class:"add", text:label, on:{ click:fn }}); }
    function panel(title, kids){ return h("div",{class:"panel"},[ h("h3",{text:title}) ].concat(Array.isArray(kids)?kids:[kids])); }
    function listToText(a){ return (a||[]).join("\n"); }
    function textToList(t){ return String(t||"").split("\n").map(function(s){return s.trim();}).filter(Boolean); }
    function csvToList(t){ return String(t||"").split(",").map(function(s){return s.trim();}).filter(Boolean); }

    /* ---------- media editor (cover / hero / gallery items) ---------- */
    function mediaEditor(m, after, opts){
      opts = opts || {};
      var wrap = h("div",{class:"media-ed"});
      function rebuild(){ var n = mediaEditor(m, after, opts); wrap.replaceWith(n); }
      function identityChanged(){ if (opts.onIdentityChange) opts.onIdentityChange(); }
      var types = ["text","image","video","youtube","embed"];
      wrap.appendChild(selectField("Media type", m.type || "text",
        types.map(function(t){return {value:t,label:t};}),
        function(v){ m.type = v; save(); rebuild(); }));

      if (opts.gallery){
        wrap.appendChild(field("Media card name", m.name, function(v){
          m.name = v;
          save();
          identityChanged();
        }, {
          placeholder: m.label2 || m.label || m.title || m.alt || "Untitled media",
          hint: "Used to identify this item in the admin list. It does not replace the public caption."
        }));
      }

      if (!m.type || m.type === "text"){
        wrap.appendChild(field("Big label", m.label, function(v){ m.label=v; save(); identityChanged(); }, {placeholder:"RUF", mono:true}));
        wrap.appendChild(field("Sub-label", m.sub, function(v){ m.sub=v; save(); }, {placeholder:"Radiant Undead Framework"}));
      } else if (m.type === "image"){
        var embedded = typeof m.src === "string" && m.src.indexOf("data:image/") === 0;
        if (embedded) {
          wrap.appendChild(h("div",{class:"embedded-media-status"},[
            h("strong",{text:"Embedded image"}),
            h("span",{text:Math.round(m.src.length * 0.75 / 1024) + " KB stored in this media card"})
          ]));
        }
        wrap.appendChild(field("Image path or URL", embedded ? "" : m.src, function(v){
          if (v.trim() || !embedded) { m.src=v.trim(); save(); rebuild(); }
        }, {
          placeholder:embedded ? "Paste a path or URL to replace the uploaded image" : "assets/media/shot.png",
          mono:true,
          event:"change",
          hint:embedded ? "Leave this empty to keep the uploaded image." : ""
        }));
        wrap.appendChild(uploadField("Upload an image", function(d){ m.src=d; save(); rebuild(); }));
        wrap.appendChild(field("Alt text", m.alt, function(v){ m.alt=v; save(); identityChanged(); }));
        if (m.src) wrap.appendChild(h("img",{class:"thumbprev", src:m.src, alt:""}));
      } else if (m.type === "video"){
        wrap.appendChild(field("Video path or URL (.mp4)", m.src, function(v){ m.src=v; save(); }, {placeholder:"assets/media/clip.mp4", mono:true}));
        wrap.appendChild(field("Poster image (path/URL)", m.poster, function(v){ m.poster=v; save(); }, {placeholder:"assets/media/poster.png", mono:true}));
        wrap.appendChild(field("Short label", m.label, function(v){ m.label=v; save(); identityChanged(); }));
      } else if (m.type === "youtube"){
        var ytInput;
        var ytOnChange = function(e){
          var id = parseYouTube(e.target.value);
          m.id = id;
          e.target.value = id;
          save();
        };
        ytInput = h("input", {class:"in in--mono", type:"text", value: m.id || "", placeholder:"https://youtu.be/VIDEO_ID",
          on: { change: ytOnChange, blur: ytOnChange }});
        wrap.appendChild(h("label",{class:"f"},[
          h("span",{class:"f__label",text:"YouTube link or ID"}),
          ytInput,
          h("span",{class:"f__hint",text:"Paste the full link. The ID is extracted when you leave the field."})
        ]));
        wrap.appendChild(field("Short label", m.label, function(v){ m.label=v; save(); identityChanged(); }));
      } else if (m.type === "embed"){
        wrap.appendChild(field("Embed URL (iframe src)", m.src, function(v){ m.src=v; save(); }, {placeholder:"https://itch.io/embed/123456", mono:true, hint:"itch.io, Sketchfab, Steam widget, etc."}));

    function mediaItemThumb(m){
      var box = h("span",{class:"media-item__thumb"});
      var src = "";
      if (m.type === "image" && m.src) src = m.src;
      else if (m.type === "video" && m.poster) src = m.poster;
      else if (m.type === "youtube" && m.id) src = "https://img.youtube.com/vi/" + m.id + "/mqdefault.jpg";

      if (src) box.appendChild(h("img",{src:src, alt:""}));
      else box.appendChild(h("span",{text:(m.type || "text").slice(0,3).toUpperCase()}));
      return box;
    }

    function compactMediaItem(m, index, list){
      function displayTitle(){ return m.name || m.label2 || m.label || m.title || m.alt || "Untitled media"; }
      var title = displayTitle();
      var titleEl = h("strong",{class:"media-item__title",text:title});
      var body = h("div",{class:"media-item__body", hidden:true},[
        mediaEditor(m, reRender, {
          gallery:true,
          list:list,

        })
      ]);
      var toggle = h("button",{
        class:"media-item__toggle",
        attrs:{type:"button","aria-expanded":"false"},
        on:{click:function(){

        }}
      },[
        mediaItemThumb(m),

        ]),
        m.featured ? h("span",{class:"media-item__featured",text:"Featured"}) : null

      return h("div",{class:"media-item"},[

      mainEl.appendChild(panel("Media gallery", gbox));

      // sections
      var secs = p.sections || (p.sections=[]);
      var sbox = h("div");
      sbox.appendChild(h("div",{class:"note",text:"Recommended order: Problem, My role, Constraints, Technical approach, Key decisions, Result, and What I learned."}));
      secs.forEach(function(s,j){
        sbox.appendChild(h("div",{class:"sub"},[
          h("div",{class:"row"},[ field("Heading", s.heading, function(v){ s.heading=v; save(); }), rowTools(secs,j,reRender) ]),
          field("Body (blank line = new paragraph)", s.body, function(v){ s.body=v; save(); }, {textarea:true, rows:4}),
          field("Bullet list (one per line, optional)", listToText(s.list), function(v){ var l=textToList(v); if(l.length) s.list=l; else delete s.list; save(); }, {textarea:true, rows:3})
        ]));
      });
      sbox.appendChild(addBtn("+ Add section", function(){ secs.push({heading:"",body:""}); reRender(); }));
      mainEl.appendChild(panel("Case study sections", sbox));

      // links
      var links = p.links || (p.links=[]);
      var lbox = h("div");
      links.forEach(function(l,j){
        lbox.appendChild(h("div",{class:"sub"},[
          h("div",{class:"row"},[ field("Button text", l.text, function(v){ l.text=v; save(); }), rowTools(links,j,reRender) ]),
          field("URL", l.url, function(v){ l.url=v; save(); }, {mono:true}),
          checkField("Accent (highlighted) button", l.accent, function(c){ l.accent=c; save(); })
        ]));
      });
      lbox.appendChild(addBtn("+ Add link", function(){ links.push({text:"",url:""}); reRender(); }));
      mainEl.appendChild(panel("Action buttons", lbox));

      mainEl.appendChild(h("button",{class:"add", text:"Preview this project ↗", on:{ click:function(){ previewPage.value; openPreviewProject(p.id); }}}));
      mainEl.appendChild(h("button",{class:"danger", style:"margin-left:8px;padding:8px 13px;border-radius:8px;font-size:12px", text:"Delete project", on:{ click:function(){ if(confirm('Delete "'+(p.title||"this project")+'"?')){ state.PROJECTS.splice(i,1); editing=null; reRender(); } }}}));
    }
    function openPreviewProject(id){
      var url = "project.html?id="+encodeURIComponent(id);
      if (previewBox.classList.contains("hidden")) { window.open(url,"_blank"); return; }
      // add the option if missing, then select + load
      var opt = Array.prototype.slice.call(previewPage.options).filter(function(o){return o.value===url;})[0];
      if (!opt){ opt = h("option",{value:url, text:"▸ "+id}); previewPage.appendChild(opt); }
      previewPage.value = url; refreshPreview();
    }

    /* ---------- PUBLISH ---------- */
    var MEDIA_PREFIX = "assets/media/";
    function extFromDataUrl(dataUrl){
      var mime = (dataUrl.slice(0, dataUrl.indexOf(";")) || "").split("/")[1] || "";
      return mime.split("+")[0] || "png";
    }
    function b64FromDataUrl(dataUrl){
      var i = dataUrl.indexOf(",");
      return i > -1 ? dataUrl.slice(i + 1) : "";
    }
    function collectEmbeddedMedia(projects){
      var out = [];
      projects.forEach(function(p){
        var id = slug(p.id || p.title);
        function take(kind, index, src, suffix){
          if (typeof src !== "string" || src.indexOf("data:image/") !== 0) return null;
          var path = MEDIA_PREFIX + id + "-" + kind + (kind === "cover" ? "" : "-" + index) + (suffix || "") + "." + extFromDataUrl(src);
          out.push({ path: path, b64: src });
          return path;
        }
        if (p.cover) { var r = take("cover", 0, p.cover.src); if (r) p.cover.src = r; }
        (p.media || []).forEach(function(m, i){
          if (!m) return;
          var srcOrig = m.src;
          var r = take("media", i, srcOrig); if (r) m.src = r;
          if (m.poster && m.poster !== srcOrig) { r = take("media", i, m.poster, "-poster"); if (r) m.poster = r; }
        });
        (p.gallery || []).forEach(function(g, i){
          if (!g) return;
          var srcOrig = g.src;
          var r = take("gallery", i, srcOrig); if (r) g.src = r;
          if (g.poster && g.poster !== srcOrig) { r = take("gallery", i, g.poster, "-poster"); if (r) g.poster = r; }
        });
      });
      var seen = {}, unique = [];
      out.forEach(function(x){ if (!seen[x.path]) { seen[x.path] = true; unique.push(x); } });
      return unique;
    }
    function collectExport(){
      var projects = clone(state.PROJECTS);
      var media = collectEmbeddedMedia(projects);
      return {
        text: "/* =========================================================================\n" +
              "   PORTFOLIO DATA - Mark Zaki\n" +
              "   Generated by admin.html. You can still hand-edit this file by hand.\n" +
              "   ========================================================================= */\n\n" +
              "const PROFILE = " + JSON.stringify(state.PROFILE, null, 2) + ";\n\n" +
              "const THEME = " + JSON.stringify(state.THEME, null, 2) + ";\n\n" +
              "const PROJECTS = " + JSON.stringify(projects, null, 2) + ";\n",
        media: media
      };
    }
    function buildDataJs(){ return collectExport().text; }
    function download(name, content, mime){
      var blob = content instanceof Blob ? content : new Blob([content], {type: mime || "text/plain"});
      var url = URL.createObjectURL(blob);
      var a = h("a", {href: url, download: name});
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 200);
    }
    function b64ToBytes(b64){
      var bin = atob(b64);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }
    function crc32(buf){
      var table = crc32.table || (crc32.table = (function(){
        var t = [], c, n, k;
        for (n = 0; n < 256; n++){ c = n; for (k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
        return t;
      })());
      var crc = 0xFFFFFFFF, i;
      for (i = 0; i < buf.length; i++) crc = table[(crc ^ buf[i]) & 0xFF] ^ (crc >>> 8);
      return (crc ^ 0xFFFFFFFF) >>> 0;
    }
    function concatBytes(parts, total){
      var out = new Uint8Array(total), o = 0;
      parts.forEach(function(p){ out.set(p, o); o += p.length; });
      return out;
    }
    function buildZip(files){
      /* Store-only ZIP writer (no compression). files: [{name, data:Uint8Array}] */
      var enc = new TextEncoder();
      var chunks = [], central = [], offset = 0;
      var d = new Date();
      var dosTime = ((d.getHours() << 11) | (d.getMinutes() << 5) | (Math.floor(d.getSeconds() / 2))) & 0xFFFF;
      var dosDate = (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF;
      files.forEach(function(f){
        var nameBytes = enc.encode(f.name);
        var crc = crc32(f.data), size = f.data.length;
        var hdr = new Uint8Array(30 + nameBytes.length);
        var v = new DataView(hdr.buffer);
        v.setUint32(0, 0x04034b50, true);
        v.setUint16(4, 20, true);
        v.setUint16(6, 0x0800, true);
        v.setUint16(8, 0, true);
        v.setUint16(10, dosTime, true);
        v.setUint16(12, dosDate, true);
        v.setUint32(14, crc, true);
        v.setUint32(18, size, true);
        v.setUint32(22, size, true);
        v.setUint16(26, nameBytes.length, true);
        v.setUint16(28, 0, true);
        hdr.set(nameBytes, 30);
        chunks.push(hdr, f.data);
        central.push({ nameBytes: nameBytes, crc: crc, size: size, offset: offset });
        offset += hdr.length + size;
      });
      var cdStart = offset, cdSize = 0, cdParts = [];
      central.forEach(function(c){
        var cd = new Uint8Array(46 + c.nameBytes.length);
        var v = new DataView(cd.buffer);
        v.setUint32(0, 0x02014b50, true);
        v.setUint16(4, 20, true);
        v.setUint16(6, 20, true);
        v.setUint16(8, 0x0800, true);
        v.setUint16(10, 0, true);
        v.setUint16(12, dosTime, true);
        v.setUint16(14, dosDate, true);
        v.setUint32(16, c.crc, true);
        v.setUint32(20, c.size, true);
        v.setUint32(24, c.size, true);
        v.setUint16(28, c.nameBytes.length, true);
        v.setUint16(30, 0, true);
        v.setUint16(32, 0, true);
        v.setUint16(34, 0, true);
        v.setUint16(36, 0, true);
        v.setUint32(38, c.offset, true);
        v.setUint32(42, 0, true);
        cd.set(c.nameBytes, 46);
        cdParts.push(cd);
        cdSize += cd.length;
      });
      var eocd = new Uint8Array(22);
      var v = new DataView(eocd.buffer);
      v.setUint32(0, 0x06054b50, true);
      v.setUint16(4, 0, true);
      v.setUint16(6, 0, true);
      v.setUint16(8, central.length, true);
      v.setUint16(10, central.length, true);
      v.setUint32(12, cdSize, true);
      v.setUint32(16, cdStart, true);
      v.setUint16(20, 0, true);
      return new Blob([concatBytes(chunks.concat(cdParts).concat([eocd]), cdStart + cdSize + eocd.length)], { type: "application/zip" });
    }
    function zipExport(){
      var ex = collectExport();
      var files = ex.media.map(function(m){ return { name: m.path, data: b64ToBytes(b64FromDataUrl(m.b64)) }; });
      files.push({ name: "data.js", data: new TextEncoder().encode(ex.text) });
      return buildZip(files);
    }
    function renderPublish(){
      var ex = collectExport();
      var embeddedSize = ex.media.reduce(function(sum, m){ return sum + b64FromDataUrl(m.b64).length; }, 0) * 0.75;
      head("Publish", "Your edits live in this browser as a draft. To make them public, export the site and commit it.");
      mainEl.appendChild(h("div",{class:"note", html:
        "<b>How publishing works.</b> The editor saves a working <em>draft</em> in this browser, and the preview reads it instantly. " +
        "Images are no longer embedded in <b>data.js</b> — they are exported as files into <b>assets/media/</b>:<br><br>" +
        "1. Click <b>Export ZIP</b> below (or in the top bar) to download <b>data.js</b> plus all media files in one archive.<br>" +
        "2. Unzip it into your repository root (over your local copy, or drag the files into GitHub).<br>" +
        "3. Commit. GitHub Pages rebuilds and everyone sees the update.<br><br>" +
        "With a GitHub token configured in Settings, <b>Publish to GitHub</b> uploads the media files and <b>data.js</b> for you automatically."}));
      if (ex.media.length){
        mainEl.appendChild(h("div",{class:"note", html:
          "This draft has <b>" + ex.media.length + " embedded image(s)</b> (≈" + (embeddedSize / 1048576).toFixed(1) + " MB). " +
          "They will be written as files under <b>assets/media/</b> and referenced by path, keeping <b>data.js</b> small."}));
      }
      mainEl.appendChild(panel("Export", [
        h("button",{class:"add", text:"⬇ Export ZIP (site + media)", on:{ click:function(){ download("portfolio-publish.zip", zipExport(), "application/zip"); } }}),
        h("button",{class:"add", style:"margin-left:8px", text:"⬇ Export data.js only", on:{ click:function(){ download("data.js", buildDataJs(), "text/javascript"); } }}),
        h("button",{class:"add", style:"margin-left:8px", text:"⬇ Export JSON backup", on:{ click:function(){ download("portfolio-backup.json", JSON.stringify(state,null,2), "application/json"); } }}),
        h("label",{class:"add", style:"margin-left:8px;display:inline-block"}, [
          "⬆ Import JSON backup",
          h("input",{type:"file", style:"display:none", attrs:{accept:".json,application/json"}, on:{ change:function(e){
            var f=e.target.files[0]; if(!f) return; var r=new FileReader();
            r.onload=function(){ try{ var d=JSON.parse(r.result); if(!d.PROFILE) throw 0; state=d; editing=null; reRender(); alert("Backup imported."); }catch(x){ alert("That file is not a valid backup."); } };
            r.readAsText(f);
          }}})
        ])
      ]));
      mainEl.appendChild(panel("Preview of generated data.js", h("pre",{class:"export", text: buildDataJs()})));
      mainEl.appendChild(panel("Danger zone", [
        h("button",{class:"danger", style:"padding:8px 13px;border-radius:8px;font-size:12px", text:"Discard draft & reload from committed data.js", on:{ click:function(){
          if(confirm("Discard ALL unsaved edits and start from the committed data.js?")){
            localStorage.removeItem(DRAFT_KEY);
            localStorage.removeItem(THEME_CACHE_KEY);
            removeDraftFromDb().catch(function(err){ console.error(err); });
            state=clone(DEFAULTS);
            editing=null;
            render();
            refreshPreview();
            setStatus("committed data loaded", true);
          }
        }}})
      ]));
    }

    /* ---------- SETTINGS (lock + GitHub) ---------- */
    function renderSettings(){
      head("Settings", "Optional passphrase lock and GitHub save setup.");
      var hasPass = !!localStorage.getItem(PASS_KEY);
      var gh = loadGitHubSettings() || {};

      mainEl.appendChild(h("div",{class:"note", html:
        "<b>Save to GitHub.</b> With a personal access token, the <b>Save to GitHub</b> button commits <b>data.js</b> directly to your repo. No manual export needed. " +
        "Create a token at GitHub → Settings → Developer settings → Personal access tokens → Tokens (classic), with <b>repo</b> scope."}));

      mainEl.appendChild(panel("GitHub save", [
        field("GitHub owner", gh.owner || "", function(v){ gh.owner = v; }, {mono:true, placeholder:"MarkZaki"}),
        field("Repository name", gh.repo || "", function(v){ gh.repo = v; }, {mono:true, placeholder:"MarkZaki.github.io"}),
        field("Branch", gh.branch || "", function(v){ gh.branch = v; }, {mono:true, placeholder:"main"}),
        field("File path", gh.path || "", function(v){ gh.path = v; }, {mono:true, placeholder:"data.js"}),
        field("Personal access token", gh.token || "", function(v){ gh.token = v; }, {type:"password", mono:true, placeholder:"ghp_..."}),
        h("button",{class:"add", text:"Save GitHub settings", on:{ click:function(){
          if(!gh.owner || !gh.repo){ alert("Owner and repo are required."); return; }
          saveGitHubSettings({
            owner: gh.owner.trim(),
            repo: gh.repo.trim(),
            branch: (gh.branch || "main").trim(),
            path: (gh.path || "data.js").trim(),
            token: gh.token.trim()
          });
          alert("GitHub settings saved.");
        }}})
      ]));

      mainEl.appendChild(h("div",{class:"note", html:
        "<b>Note on the lock.</b> This is light deterrence for a static site. The passphrase is checked in your browser, so it is not real security. " +
        "If you want this editor truly private, don't deploy <b>admin.html</b> publicly (keep it local, or remove it before pushing). The site itself does not link to it."}));
      mainEl.appendChild(panel("Passphrase lock", [
        h("div",{class:"f__label", text: hasPass ? "A passphrase is currently set." : "No passphrase set. The editor opens freely."}),
        field("Set / change passphrase", "", function(v){ window.__newpass = v; }, {type:"password", placeholder:"new passphrase"}),
        h("button",{class:"add", text:"Save passphrase", on:{ click:function(){
          if(!window.__newpass){ alert("Type a passphrase first."); return; }
          sha256(window.__newpass).then(function(hsh){ localStorage.setItem(PASS_KEY, hsh); window.__newpass=""; alert("Passphrase saved. It will be required next time you open the editor."); render(); });
        }}}),
        hasPass ? h("button",{class:"danger", style:"margin-left:8px;padding:8px 13px;border-radius:8px;font-size:12px", text:"Remove passphrase", on:{ click:function(){ if(confirm("Remove the passphrase lock?")){ localStorage.removeItem(PASS_KEY); render(); } }}}) : null
      ]));
    }

    /* ---------- crypto for lock ---------- */
    function sha256(str){
      var enc = new TextEncoder().encode(str);
      return crypto.subtle.digest("SHA-256", enc).then(function(buf){
        return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ("0"+b.toString(16)).slice(-2); }).join("");
      });
    }

    /* ====================================================================
       BOOT
       ==================================================================== */
    function startApp(){
      document.getElementById("app").style.display = "";
      statusEl = document.getElementById("status");
      mainEl = document.getElementById("main");
      previewFrame = document.getElementById("preview-frame");
      previewPage = document.getElementById("preview-page");
      previewBox = document.getElementById("preview");

      document.getElementById("btn-save").addEventListener("click", function(){
        setStatus("saving");
        flushDraft();
      });
      document.getElementById("btn-github").addEventListener("click", saveToGitHub);
      document.getElementById("btn-export").addEventListener("click", function(){ download("portfolio-publish.zip", zipExport(), "application/zip"); });
      document.getElementById("btn-open").addEventListener("click", function(){ window.open(previewPage.value || "index.html", "_blank"); });
      document.getElementById("preview-refresh").addEventListener("click", refreshPreview);
      previewPage.addEventListener("change", refreshPreview);
      document.getElementById("btn-preview-toggle").addEventListener("click", function(){
        previewBox.classList.toggle("hidden");
        this.textContent = previewBox.classList.contains("hidden") ? "Show preview" : "Hide preview";
        refreshPreview();
      });

      render();
      setStatus("draft active");
      refreshPreview();
    }

    function boot(){
      var hash = localStorage.getItem(PASS_KEY);
      if (!hash){ startApp(); return; }
      var lock = document.getElementById("lock");
      lock.style.display = "";
      var input = document.getElementById("lock-input");
      var err = document.getElementById("lock-err");
      function tryUnlock(){
        sha256(input.value).then(function(h2){
          if (h2 === hash){ lock.style.display="none"; startApp(); }
          else { err.textContent = "Wrong passphrase."; input.select(); }
        });
      }
      document.getElementById("lock-go").addEventListener("click", tryUnlock);
      input.addEventListener("keydown", function(e){ if(e.key==="Enter") tryUnlock(); });
      input.focus();
    }

    readDraftFromDb()
      .then(function(draft){ if (draft && draft.PROFILE) initializeState(draft); })
      .catch(function(err){ console.warn("Large draft storage is unavailable.", err); })
      .then(boot);
  })();
  </script>
